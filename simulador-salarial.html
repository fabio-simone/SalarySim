<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Salarial</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0c;--s1:#141414;--s2:#1a1a1a;--s3:#242424;
  --bd:#2a2a2a;--bd2:#383838;
  --o:#f97316;--o2:#fb923c;--od:rgba(249,115,22,.12);
  --t:#e8e8e8;--t2:#777;--t3:#444;
  --red:#ef4444;--grn:#4ade80;
  --r:8px;
}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;line-height:1.5;min-height:100vh}

/* ── LOCK / AUTH ─────────────────── */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .3s}
#lock.out{opacity:0;pointer-events:none}
.lk{width:320px;text-align:center}
.lk-title{font-size:26px;font-weight:800;color:var(--o);letter-spacing:-1px;margin-bottom:2px}
.lk-sub{font-size:10px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:32px}
.lk-bar{width:28px;height:2px;background:var(--o);margin:0 auto 28px;border-radius:1px}
.lk-tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid var(--bd2);border-radius:var(--r);overflow:hidden}
.lk-tab{flex:1;padding:8px;background:transparent;border:none;color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.lk-tab.on{background:var(--s2);color:var(--o)}
.lk-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:6px;text-align:left}
.lk-in{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 14px;color:var(--t);font-size:14px;outline:none;transition:border-color .15s;font-family:inherit;margin-bottom:10px}
.lk-in:focus{border-color:var(--o)}
.lk-btn{width:100%;margin-top:4px;background:var(--o);border:none;border-radius:var(--r);padding:11px;color:#000;font-weight:800;font-size:12px;cursor:pointer;letter-spacing:.05em;transition:background .15s;font-family:inherit}
.lk-btn:hover{background:var(--o2)}
.lk-btn:disabled{opacity:.5;cursor:not-allowed}
.lk-err{font-size:11px;color:var(--red);margin-top:8px;min-height:16px;text-align:left}
.lk-ok{font-size:11px;color:var(--grn);margin-top:8px;min-height:16px;text-align:left}
.lk-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--t3);font-size:10px}
.lk-divider::before,.lk-divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.lk-foot{font-size:10px;color:var(--t3);margin-top:24px;line-height:1.7}
.lk-foot a{color:var(--o);text-decoration:none}
.lk-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SHELL ─────────────────────── */
#app{display:none;min-height:100vh;flex-direction:column}
#app.show{display:flex}
header{background:var(--s1);border-bottom:1px solid var(--bd);padding:10px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.h-brand{font-size:13px;font-weight:800;color:var(--o);letter-spacing:-.2px;white-space:nowrap}
.h-tag{font-size:9px;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-top:1px}
.h-eq{display:flex;gap:4px;margin-left:auto}
.h-user{display:flex;align-items:center;gap:8px;margin-left:8px;padding-left:8px;border-left:1px solid var(--bd)}
.h-email{font-size:10px;color:var(--t3);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-logout{background:transparent;border:1px solid var(--bd2);border-radius:5px;color:var(--t3);font-size:10px;padding:3px 8px;cursor:pointer;font-family:inherit;transition:all .12s}
.h-logout:hover{border-color:var(--red);color:var(--red)}
.h-save{background:transparent;border:1px solid var(--bd2);border-radius:5px;color:var(--t2);font-size:10px;padding:3px 8px;cursor:pointer;font-family:inherit;transition:all .12s;display:flex;align-items:center;gap:4px}
.h-save:hover{border-color:var(--o);color:var(--o)}
.h-save.saved{border-color:var(--grn);color:var(--grn)}
.h-save.saving{opacity:.6;cursor:not-allowed}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);flex-shrink:0}
.sync-dot.syncing{background:var(--o);animation:pulse .8s ease-in-out infinite}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabbar{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 22px;display:flex;align-items:center;gap:2px}
.tb{background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .12s;outline:none;font-family:inherit}
.tb.on{border-color:var(--o);color:var(--o);font-weight:700}
.tb:hover:not(.on){color:var(--t)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px;padding-bottom:2px}

/* Pills */
.pill{background:transparent;border:1px solid var(--bd2);border-radius:20px;padding:3px 12px;color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;outline:none;font-family:inherit}
.pill.on{background:var(--od);border-color:var(--o);color:var(--o)}
.pill.on-red{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:var(--red)}
.pill.on-grn{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--grn)}
.pill:hover:not(.on):not(.on-red):not(.on-grn){color:var(--t)}

/* Mini inputs */
.mi{width:44px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;color:var(--t);padding:2px 5px;font-size:11px;font-family:monospace;outline:none;transition:border-color .12s;text-align:center}
.mi:focus{border-color:var(--o)}
.mi-l{font-size:10px;color:var(--t3)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}

/* Content */
#view{padding:18px 22px;max-width:1360px;margin:0 auto;width:100%}

/* Controls */
.ctrl{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ctrl-sep{width:1px;height:14px;background:var(--bd);margin:0 3px}
.ctrl-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}

/* Cards */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:14px}
.sum-card{background:var(--s2);border:1px solid var(--bd);border-left:3px solid var(--o);border-radius:var(--r);padding:12px 13px}
.sc-lbl{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-val{font-size:18px;font-weight:800;font-family:monospace;letter-spacing:-.5px}
.sc-row{display:flex;gap:8px;margin-top:3px;font-size:9px;color:var(--t3)}

/* Charts */
.ch-card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ch-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.ch-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--t2)}
.ch-sub{font-size:9px;color:var(--t3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.lg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.lg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.empty{text-align:center;padding:60px;color:var(--t3);font-size:12px}
.empty em{color:var(--o);font-style:normal}

/* Scenarios */
.sce{display:grid;grid-template-columns:205px 1fr;gap:14px;align-items:start}
.sidebar{position:sticky;top:90px}
.sb-ttl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.sl{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;margin-bottom:4px;cursor:pointer;transition:all .12s}
.sl:hover{border-color:var(--bd2)}
.sl.on{background:var(--s2);border-color:var(--bd2)}
.sl-top{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.sl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sl-name{flex:1;font-size:12px;font-weight:600;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .12s}
.sl.on .sl-name{color:var(--t)}
.sl-tog{background:none;border:none;cursor:pointer;padding:0;outline:none;font-size:15px;line-height:1;flex-shrink:0}
.sl-bot{display:flex;align-items:center;justify-content:space-between}
.sl-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.sl-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:12px;padding:0;outline:none;transition:color .12s}
.sl-del:hover{color:var(--red)}
.sl-add{width:100%;padding:7px;background:transparent;border:1px dashed var(--bd);border-radius:var(--r);color:var(--t3);font-size:11px;cursor:pointer;margin-top:3px;outline:none;transition:all .12s;font-family:inherit}
.sl-add:hover{border-color:var(--o);color:var(--o)}
.add-menu{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:7px;margin-top:4px}
.add-opt{display:block;width:100%;padding:6px 8px;background:transparent;border:none;color:var(--t2);font-size:11px;text-align:left;cursor:pointer;border-radius:5px;transition:all .12s;outline:none;font-family:inherit}
.add-opt:hover{background:var(--s3);color:var(--t)}
.add-badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;margin-right:5px}

/* Form */
.fh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fh-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fh-name{flex:1;background:transparent;border:none;font-size:14px;font-weight:800;color:var(--t);outline:none;font-family:inherit;min-width:0}
.fh-type{font-size:9px;padding:2px 8px;border-radius:4px;font-weight:700;white-space:nowrap;flex-shrink:0}
.form-body{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.fsec{margin-bottom:18px}
.fsec:last-child{margin-bottom:0}
.fsec-hdr{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.fsec-bar{width:2px;height:12px;border-radius:1px;flex-shrink:0}
.fsec-ttl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.fg1{display:grid;grid-template-columns:1fr;gap:5px}
.fc2{grid-column:1/-1}
.fld{margin:0}
.fld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.fld-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t2)}
.fld-hint{font-size:9px;color:var(--t3);font-weight:400;text-transform:none;letter-spacing:0;text-align:right;max-width:160px;line-height:1.3}
.fld-ctx{font-size:10px;color:var(--t3);margin-bottom:3px;line-height:1.4;font-style:italic}
.iw{display:flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:6px;overflow:hidden;transition:border-color .12s}
.iw:focus-within{border-color:var(--o)}
.ip{padding:5px 8px;color:var(--t3);font-size:11px;white-space:nowrap;flex-shrink:0}
.ip.l{border-right:1px solid var(--bd)}
.ip.r{border-left:1px solid var(--bd)}
.ni{flex:1;background:transparent;border:none;color:var(--t);padding:5px 8px;font-size:12px;outline:none;font-family:monospace;min-width:0}
.tog-row{display:flex;gap:5px}
.tog{flex:1;padding:5px 4px;background:transparent;border:1px solid var(--bd);border-radius:5px;color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;outline:none;font-family:inherit}
.tog.on{background:var(--o);color:#000;border-color:var(--o)}
.ib{border-radius:6px;padding:9px 12px;margin-bottom:12px;font-size:11px;line-height:1.8;border:1px solid}

/* Preview */
.pv{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;margin-top:10px}
.pv-ttl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);margin-bottom:8px}
.pv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pv-item{text-align:center}
.pv-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.pv-val{font-size:13px;font-weight:800;font-family:monospace}

/* Projection table */
.proj-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;min-width:660px}
th{padding:8px 11px;text-align:right;font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap;font-weight:600}
th:first-child{text-align:left;position:sticky;left:0;z-index:1;min-width:155px;background:var(--s2)}
td{padding:7px 11px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child{text-align:left;position:sticky;left:0;z-index:1}
tr:last-child td{border-bottom:none}
tr:nth-child(odd) td{background:var(--s1)}
tr:nth-child(even) td{background:var(--bg)}
tr:nth-child(odd) td:first-child{background:var(--s2)}
tr:nth-child(even) td:first-child{background:var(--s1)}
th:first-child{background:var(--s2)!important}
.td-name{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.td-type{font-size:9px;color:var(--t3);margin-top:1px}
.td-val{font-size:12px;font-weight:600;font-family:monospace}
.td-chg{font-size:9px;margin-top:1px}
.td-cum{font-size:13px;font-weight:800;font-family:monospace;color:var(--o)}
.td-cs{font-size:9px;color:var(--t3);margin-top:1px}

/* Legend table */
.leg-tbl{width:100%;font-size:11px;border-collapse:collapse;margin-bottom:14px}
.leg-tbl td{padding:4px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
.leg-tbl td:first-child{color:var(--o);font-weight:700;white-space:nowrap;padding-right:16px}
.leg-tbl td:last-child{color:var(--t2)}
.leg-tbl tr:last-child td{border-bottom:none}

/* Notes */
.notes{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:13px;margin-top:12px;font-size:11px;color:var(--t2);line-height:1.9}
.hl{color:var(--o);font-weight:700}

/* Cloud sync banner */
.sync-banner{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--t2)}
.sync-banner .sb-icon{font-size:14px}
.sync-banner a{color:var(--o);cursor:pointer;text-decoration:underline}

/* Scrollbar */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

@media(max-width:760px){
  .sce{grid-template-columns:1fr}
  .sidebar{position:static}
  .fg{grid-template-columns:1fr}
  .pv-grid{grid-template-columns:repeat(2,1fr)}
  header,#view{padding-left:14px;padding-right:14px}
  .tabbar{padding:0 14px}
  .h-email{display:none}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="lock">
  <div class="lk">
    <div class="lk-title">SalarySim</div>
    <div class="lk-sub">Propostas Salariais · Brasil 2024</div>
    <div class="lk-bar"></div>

    <div class="lk-tabs">
      <button class="lk-tab on" onclick="authTab('login')">Entrar</button>
      <button class="lk-tab" onclick="authTab('signup')">Criar conta</button>
    </div>

    <div id="auth-form">
      <div class="lk-lbl">E-mail</div>
      <input class="lk-in" id="lk-email" type="email" placeholder="seu@email.com"
        onkeydown="if(event.key==='Enter')document.getElementById('lk-pw').focus()">
      <div class="lk-lbl" id="lk-pw-lbl">Senha</div>
      <input class="lk-in" id="lk-pw" type="password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')authAction()">
      <div class="lk-lbl" style="display:none" id="lk-pw2-lbl">Confirmar senha</div>
      <input class="lk-in" id="lk-pw2" type="password" placeholder="••••••••" style="display:none"
        onkeydown="if(event.key==='Enter')authAction()">
      <button class="lk-btn" id="lk-btn" onclick="authAction()">Entrar</button>
      <div class="lk-err" id="lk-err"></div>
      <div class="lk-ok" id="lk-ok"></div>
    </div>

    <div class="lk-divider">ou</div>
    <button class="lk-btn" style="background:var(--s2);color:var(--t2);border:1px solid var(--bd2)" onclick="continueLocal()">
      Continuar sem conta (dados locais)
    </button>
    <div class="lk-foot">
      Dados salvos na nuvem ficam disponíveis<br>em qualquer dispositivo.
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <div class="h-brand">SalarySim</div>
      <div class="h-tag">Brasil · SP · IRPF 2024</div>
    </div>
    <div class="h-eq" id="eq-pills"></div>
    <div class="h-user">
      <span class="sync-dot" id="sync-dot" title="Sincronizado"></span>
      <button class="h-save" id="btn-save" onclick="saveToCloud()" title="Salvar na nuvem">💾 Salvar</button>
      <span class="h-email" id="h-email"></span>
      <button class="h-logout" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <div class="tabbar">
    <div id="tabs" style="display:flex;gap:2px"></div>
    <div class="tb-right">
      <span class="mi-l">IPCA</span>
      <input class="mi" id="mi-ipca" type="number" value="4.5" step="0.5" min="0"
        oninput="C.ipca=parseFloat(this.value)||4.5;render()">
      <span class="mi-l">%</span>
      <span class="mi-l" style="margin-left:5px">Horizonte</span>
      <input class="mi" id="mi-hor" type="number" value="10" step="1" min="1" max="10"
        oninput="C.hor=Math.max(1,Math.min(10,parseInt(this.value)||10));render()">
      <span class="mi-l">anos</span>
    </div>
  </div>
  <div id="view"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// ⚙️  CONFIGURAÇÃO SUPABASE
// Substitua com suas credenciais do painel Supabase:
// https://supabase.com/dashboard/project/<seu-projeto>/settings/api
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = 'https://oqerbezmehucqwlsltwn.supabase.co';
const SUPABASE_ANON = 'sb_publishable_MA2Gm0mLccPPH5mSFX2Rvw_303wmPly';
// ═══════════════════════════════════════════════════════════════

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let _authMode = 'login';
let _currentUser = null;
let _saveTimer = null;

// ── AUTH UI ──────────────────────────────────────────────────
function authTab(mode){
  _authMode = mode;
  document.querySelectorAll('.lk-tab').forEach((t,i)=>
    t.classList.toggle('on', (mode==='login'&&i===0)||(mode==='signup'&&i===1)));
  document.getElementById('lk-btn').textContent = mode==='login'?'Entrar':'Criar conta';
  const pw2 = document.getElementById('lk-pw2');
  const pw2l = document.getElementById('lk-pw2-lbl');
  pw2.style.display = mode==='signup'?'block':'none';
  pw2l.style.display = mode==='signup'?'block':'none';
  clearMsg();
}

function clearMsg(){
  document.getElementById('lk-err').textContent='';
  document.getElementById('lk-ok').textContent='';
}

function setErr(msg){ document.getElementById('lk-err').textContent=msg; document.getElementById('lk-ok').textContent=''; }
function setOk(msg) { document.getElementById('lk-ok').textContent=msg;  document.getElementById('lk-err').textContent=''; }

async function authAction(){
  const email = document.getElementById('lk-email').value.trim();
  const pw    = document.getElementById('lk-pw').value;
  const pw2   = document.getElementById('lk-pw2').value;
  const btn   = document.getElementById('lk-btn');

  if(!email){ setErr('Informe o e-mail.'); return; }
  if(!pw){ setErr('Informe a senha.'); return; }
  if(_authMode==='signup' && pw!==pw2){ setErr('As senhas não coincidem.'); return; }

  btn.disabled=true;
  btn.innerHTML='<span class="lk-spinner"></span>Aguarde…';
  clearMsg();

  try{
    let data, error;
    if(_authMode==='login'){
      ({data,error} = await sb.auth.signInWithPassword({email,password:pw}));
    } else {
      ({data,error} = await sb.auth.signUp({email,password:pw}));
    }

    if(error) throw error;

    if(_authMode==='signup' && !data.session){
      setOk('Conta criada! Verifique seu e-mail para confirmar o cadastro.');
      btn.disabled=false; btn.textContent='Criar conta';
      return;
    }

    _currentUser = data.user || data.session?.user;
    await bootFromCloud();
  } catch(e){
    setErr(e.message||'Erro ao autenticar.');
    btn.disabled=false;
    btn.textContent = _authMode==='login'?'Entrar':'Criar conta';
  }
}

function continueLocal(){
  _currentUser = null;
  hideLock();
  loadLocal();
  boot();
}

function hideLock(){
  const lk = document.getElementById('lock');
  lk.classList.add('out');
  setTimeout(()=>lk.style.display='none', 300);
}

async function doLogout(){
  await sb.auth.signOut();
  _currentUser = null;
  sessionStorage.removeItem('ss_local');
  location.reload();
}

// ── SUPABASE PERSISTENCE ─────────────────────────────────────
async function bootFromCloud(){
  hideLock();

  document.getElementById('h-email').textContent = _currentUser?.email || '';
  document.getElementById('btn-save').style.display = 'flex';

  // Try loading from cloud first
  const { data, error } = await sb
    .from('simulacoes')
    .select('payload')
    .eq('user_id', _currentUser.id)
    .order('updated_at', { ascending: false })
    .limit(1)
    .single();

  if(data?.payload){
    try{
      const parsed = JSON.parse(data.payload);
      if(parsed.S?.scenarios?.length){ S=parsed.S; _nid=parsed._nid||2; }
      else loadLocal();
    } catch(e){ loadLocal(); }
  } else {
    loadLocal();
  }

  setSyncStatus('ok');
  boot();
}

async function saveToCloud(silent=false){
  if(!_currentUser) return;

  const btn = document.getElementById('btn-save');
  setSyncStatus('syncing');
  if(!silent){ btn.classList.add('saving'); btn.textContent='💾 Salvando…'; }

  const payload = JSON.stringify({S, _nid});

  const { error } = await sb
    .from('simulacoes')
    .upsert({
      user_id: _currentUser.id,
      payload,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });

  if(error){
    setSyncStatus('error');
    if(!silent){ btn.classList.remove('saving'); btn.textContent='💾 Salvar'; }
  } else {
    setSyncStatus('ok');
    if(!silent){
      btn.classList.remove('saving');
      btn.classList.add('saved');
      btn.textContent='✓ Salvo';
      setTimeout(()=>{ btn.classList.remove('saved'); btn.textContent='💾 Salvar'; },2000);
    }
    saveLocal();
  }
}

function setSyncStatus(status){
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (status==='syncing'?' syncing':status==='error'?' error':'');
  dot.title = status==='ok'?'Sincronizado':status==='syncing'?'Salvando…':'Erro ao salvar';
}

function scheduleAutoSave(){
  if(!_currentUser) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>saveToCloud(true), 3000);
}

// ── LOCAL PERSISTENCE (fallback) ─────────────────────────────
function saveLocal(){
  try{ localStorage.setItem('ss4', JSON.stringify({S,_nid})); }catch(e){}
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem('ss4'));
    if(d?.S?.scenarios?.length){ S=d.S; _nid=d._nid||2; return; }
  }catch(e){}
  S = { scenarios:[{id:1,name:'Accenture (Atual)',type:'CLT',active:true,color:'#f97316',...DEFS.CLT}] };
}
function save(){
  saveLocal();
  scheduleAutoSave();
}

(async()=>{
  const { data:{session} } = await sb.auth.getSession();
  if(session){
    _currentUser = session.user;
    await bootFromCloud();
  }
  // lock stays visible if no session (user must login or continue local)
})();

// ═══════════════════════════════════════════════════════════════
// TAX ENGINE
// ═══════════════════════════════════════════════════════════════
function calcInss(sal){
  const faixas=[[1412,.075],[2666.68,.09],[4000.03,.12],[7786.02,.14]];
  let r=0,prev=0;
  for(const[lim,aliq] of faixas){
    if(sal<=prev)break;
    r+=(Math.min(sal,lim)-prev)*aliq;
    prev=lim;
  }
  return Math.min(r,908.86);
}
function calcIr(base){
  if(base<=2259.20)return 0;
  if(base<=2826.65)return base*.075-169.44;
  if(base<=3751.05)return base*.15-381.44;
  if(base<=4664.68)return base*.225-662.77;
  return base*.275-896;
}
function calcPlr(v){
  if(v<=6677.55)return 0;
  if(v<=9922.28)return v*.075-500.82;
  if(v<=13167)return v*.15-1244.99;
  if(v<=16380.38)return v*.225-2232.51;
  return v*.275-3051.53;
}
function calcGc(g){
  if(g<=0)return 0;
  if(g<=5e6)return g*.15;
  if(g<=10e6)return 5e6*.15+(g-5e6)*.175;
  return 5e6*.15+5e6*.175+(g-10e6)*.20;
}
function encargo(sal){return sal*(.20+.02+.058+.08);}
function tribPJ(fat12){
  const b=fat12*.32;
  return fat12*(.0065+.03+.05)+b*.15+Math.max(0,b-240000)*.10+b*.09;
}
function eqRate(base,oti,pes){
  if(C.eq==='oti')return(parseFloat(oti)||10)/100;
  if(C.eq==='pes')return(parseFloat(pes)||-(parseFloat(base)||10))/100;
  return(parseFloat(base)||10)/100;
}

// ═══════════════════════════════════════════════════════════════
// PROJECTIONS
// ═══════════════════════════════════════════════════════════════
function projCLT(s,yr){
  const g=Math.pow(1+(s.crescSal||5)/100,yr-1);
  const sal=(s.salario||0)*g;
  const i=calcInss(sal),r=Math.max(0,calcIr(sal-i));
  const liqMes=(sal-i-r)*12;
  const liq13=sal-calcInss(sal)-Math.max(0,calcIr(sal-calcInss(sal)));
  const ferBruto=sal*(4/3);
  const liqFer=ferBruto-Math.max(0,calcIr(ferBruto-calcInss(sal)));
  const pprBruto=(s.ppr||0)*g;
  const liqPpr=pprBruto-calcPlr(pprBruto);
  const bonBruto=(s.bonus||0)*g;
  const liqBon=bonBruto-Math.max(0,calcIr(bonBruto/12))*12;
  let eqBruto=0,liqEq=0;
  if((s.eqVal||0)>0){
    const cliff=s.eqCliff||1,vest=s.eqVest||4;
    if(yr>=cliff&&yr<=(cliff+vest-1)){
      const rate=eqRate(s.eqBase,s.eqOti,s.eqPes);
      let valEq=(s.eqVal||0)*Math.pow(1+rate,yr-cliff);
      if(s.eqMoeda==='USD'){
        const cam=(s.eqCambio||5.8)*Math.pow(1+(s.eqCrescCambio||3)/100,yr-1);
        valEq*=cam;
      }
      eqBruto=valEq;
      liqEq=eqBruto-Math.max(0,calcIr(eqBruto/12))*12;
    }
  }
  const bens=((s.bSaude||0)+(s.bAlim||0)+(s.bTrans||0)+(s.bPrev||0)+(s.bOut||0))*12+(s.bCarro||0);
  const bruto=sal*12+sal+ferBruto+pprBruto+bonBruto+eqBruto;
  const liq=liqMes+liq13+liqFer+liqPpr+liqBon+liqEq;
  const ctc=(sal+encargo(sal))*12+sal+bens;
  return{bruto,liq,trib:Math.max(0,bruto-liq),bens,ctc};
}

function projPJ(s,yr){
  const g=Math.pow(1+(s.crescFat||5)/100,yr-1);
  const fat12=(s.fatMensal||0)*g*12;
  const trib=tribPJ(fat12);
  const pl=(s.proLabore||0)*g;
  const i=calcInss(pl),r=Math.max(0,calcIr(pl-i));
  const liqPL=(pl-i-r)*12;
  const lucro=Math.max(0,fat12-trib-pl*12-(s.despAnuais||0)*g);
  const bens=((s.bSaude||0)+(s.bOut||0))*12;
  const liq=liqPL+lucro;
  return{bruto:fat12,liq,trib:Math.max(0,fat12-liq),bens,ctc:fat12};
}

function projNonEq(s,yr){
  const g=Math.pow(1+(s.crescSal||8)/100,yr-1);
  const pl=(s.proLabore||0)*g;
  const i=calcInss(pl),r=Math.max(0,calcIr(pl-i));
  const liqPL=(pl-i-r)*12;
  const dist=(s.dist||0)*g*12;
  const bonBruto=(s.bonus||0)*g;
  const liqBon=bonBruto-calcPlr(bonBruto);
  const bens=((s.bSaude||0)+(s.bAlim||0)+(s.bOut||0))*12;
  const liq=liqPL+dist+liqBon;
  return{bruto:pl*12+dist+bonBruto,liq,trib:Math.max(0,(i+r)*12+calcPlr(bonBruto)),bens,
    ctc:pl*12+dist+bonBruto+encargo(pl)*12+bens};
}

function projEquity(s,yr){
  const g=Math.pow(1+(s.crescimento||10)/100,yr-1);
  const pl=(s.proLabore||0)*g;
  const i=calcInss(pl),r=Math.max(0,calcIr(pl-i));
  const liqPL=(pl-i-r)*12;
  const dist=(s.dist||0)*g*12;
  const part=(s.partAnual||0)*g;
  const amort=(s.buyIn||0)>0&&yr<=(s.buyInAnos||3)?(s.buyIn||0)/(s.buyInAnos||3):0;
  let buyOut=0;
  if(yr===C.hor&&(s.buyIn||0)>0){
    const gross=(s.buyIn||0)*(s.multBuyOut||1.5);
    buyOut=gross-calcGc(gross-(s.buyIn||0));
  }
  const bens=((s.bSaude||0)+(s.bOut||0))*12;
  const liq=liqPL+dist+part-amort+(yr===C.hor?buyOut:0);
  return{bruto:pl*12+dist+part,liq,trib:(i+r)*12,bens,ctc:pl*12+dist+part+encargo(pl)*12+bens};
}

function projBigTech(s,yr){
  const g=Math.pow(1+(s.crescSal||7)/100,yr-1);
  const fx=s.moeda==='USD'?(s.cambio||5.8):1;
  const sal=(s.salario||0)*g*fx;
  const i=calcInss(sal),r=Math.max(0,calcIr(sal-i));
  const liqMes=(sal-i-r)*12;
  const liq13=sal-calcInss(sal)-Math.max(0,calcIr(sal-calcInss(sal)));
  const ferBruto=sal*(4/3);
  const liqFer=ferBruto-Math.max(0,calcIr(ferBruto-i));
  const bonBruto=(s.bonus||0)*g*fx;
  const liqBon=bonBruto-Math.max(0,calcIr(bonBruto/12))*12;
  let rsuBruto=0,liqRsu=0;
  if((s.rsuGrant||0)>0){
    const cliff=s.rsuCliff||1,vest=s.rsuVest||4;
    if(yr>=cliff&&yr<=(cliff+vest-1)){
      const rate=eqRate(s.rsuBase,s.rsuOti,s.rsuPes);
      rsuBruto=(s.rsuGrant/vest)*Math.pow(1+rate,yr-cliff)*fx;
      liqRsu=rsuBruto-Math.max(0,calcIr(rsuBruto/12))*12;
    }
  }
  const bens=((s.bSaude||0)+(s.bAlim||0)+(s.bOut||0))*12;
  const bruto=sal*12+sal+ferBruto+bonBruto+rsuBruto;
  const liq=liqMes+liq13+liqFer+liqBon+liqRsu;
  return{bruto,liq,trib:Math.max(0,bruto-liq),bens,ctc:(sal+encargo(sal))*12+sal+bens};
}

function projFundo(s,yr){
  const g=Math.pow(1+(s.crescSal||5)/100,yr-1);
  const sal=(s.salario||0)*g;
  const i=calcInss(sal),r=Math.max(0,calcIr(sal-i));
  const liqMes=(sal-i-r)*12;
  const bonBruto=(s.bonus||0)*g;
  const liqBon=bonBruto-Math.max(0,calcIr(bonBruto/12))*12;
  let ciBruto=0,liqCi=0;
  if((s.carriedVal||0)>0&&yr===(s.carriedAno||5)){
    ciBruto=s.carriedVal;
    liqCi=ciBruto-calcGc(ciBruto);
  }
  const bens=((s.bSaude||0)+(s.bOut||0))*12;
  const bruto=sal*12+bonBruto+ciBruto;
  const liq=liqMes+liqBon+liqCi;
  return{bruto,liq,trib:Math.max(0,bruto-liq),bens,ctc:(sal+encargo(sal))*12+sal+bens};
}

function project(s,yr){
  if(!s.active)return{bruto:0,liq:0,trib:0,bens:0,ctc:0};
  switch(s.type){
    case'CLT':     return projCLT(s,yr);
    case'PJ':      return projPJ(s,yr);
    case'NON_EQ':  return projNonEq(s,yr);
    case'EQUITY':  return projEquity(s,yr);
    case'BIG_TECH':return projBigTech(s,yr);
    case'FUNDO':   return projFundo(s,yr);
  }
  return{bruto:0,liq:0,trib:0,bens:0,ctc:0};
}

function computeAll(){
  return S.scenarios.filter(s=>s.active).map(s=>{
    let cumLiq=0,cumLiqR=0;
    const yrs=Array.from({length:C.hor},(_,i)=>{
      const yr=i+1,p=project(s,yr);
      const defl=Math.pow(1+C.ipca/100,-(yr-1));
      cumLiq+=p.liq; cumLiqR+=p.liq*defl;
      return{yr,...p,liqR:p.liq*defl,brutoR:p.bruto*defl,ctcR:p.ctc*defl,cumLiq,cumLiqR};
    });
    return{s,yrs};
  });
}

function getV(d){
  if(C.met==='bruto')return C.vis==='real'?d.brutoR:d.bruto;
  if(C.met==='ctc')  return C.vis==='real'?d.ctcR  :d.ctc;
  return C.vis==='real'?d.liqR:d.liq;
}

const fBRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0);
const fK=v=>{
  if(v==null||isNaN(v))return'—';
  const a=Math.abs(v),sg=v<0?'-':'';
  if(a>=1e6)return`${sg}R$${(a/1e6).toFixed(1)}M`;
  if(a>=1e3)return`${sg}R$${(a/1e3).toFixed(0)}k`;
  return fBRL(v);
};

function upd(id,field,val){ const s=S.scenarios.find(x=>x.id===id);if(!s)return;s[field]=parseFloat(val)||0;save();render(); }
function updStr(id,field,val){ const s=S.scenarios.find(x=>x.id===id);if(!s)return;s[field]=val;save();render(); }
function updName(id,val){ const s=S.scenarios.find(x=>x.id===id);if(!s)return;s.name=val;save(); }
function setEid(id){ C.eid=id;render(); }
function toggleActive(id){ const s=S.scenarios.find(x=>x.id===id);if(!s)return;s.active=!s.active;save();render(); }
function addScen(type){
  const id=_nid++;
  S.scenarios.push({id,name:`${TYPES[type].label} #${id}`,type,active:true,color:PAL[S.scenarios.length%PAL.length],...DEFS[type]});
  C.eid=id;C.addOpen=false;C.tab='cenarios';save();render();
}
function delScen(id){
  S.scenarios=S.scenarios.filter(s=>s.id!==id);
  if(C.eid===id&&S.scenarios.length)C.eid=S.scenarios[0].id;
  save();render();
}

const _ch={};
function destroyAll(){ for(const k in _ch){try{_ch[k].destroy();}catch(e){}} for(const k in _ch)delete _ch[k]; }
const COPT={
  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fK(ctx.raw)}`}}},
  scales:{
    x:{grid:{color:'#1d1d1d'},ticks:{color:'#4a4a4a',font:{size:10}}},
    y:{grid:{color:'#1d1d1d'},ticks:{color:'#4a4a4a',font:{size:10},callback:v=>fK(v)}}
  }
};
function mkChart(id,type,labels,datasets){
  const el=document.getElementById(id);if(!el)return;
  try{_ch[id]=new Chart(el,{type,data:{labels,datasets},options:COPT});}catch(e){}
}
function mkLegend(projs,id){
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=projs.map(({s})=>`<span class="lg-item"><span class="lg-dot" style="background:${s.color}"></span>${s.name}</span>`).join('');
}

    <tr><td>Benefícios</td><td>Valor estimado dos benefícios (informativo — não incluso no líquido nem no bruto)</td></tr>

  const cards=projs.length
    ?`<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">Ano 1 — ${mLbl}</div>
      <div class="sum-grid">${projs.map(({s,yrs})=>{const d=yrs[0],v=getV(d);
        return`<div class="sum-card" style="border-left-color:${s.color}">
          <div class="sc-lbl">${s.name}</div>
          <div class="sc-val" style="color:${s.color}">${fK(v)}</div>

        </div>`;}).join('')}</div>`

  const syncNote = !_currentUser

  return`

    </div>`;

function viewProj(projs){
  const mLbl=C.met==='bruto'?'Bruto':C.met==='ctc'?'CTC':'Líquido';
  const vLbl=C.vis==='real'?'Real (IPCA)':'Nominal';
  const colH=Array.from({length:C.hor},(_,i)=>`<th>Ano ${i+1}</th>`).join('');
  const rows=projs.map(({s,yrs})=>{
    const cells=yrs.map((d,i)=>{
      const v=getV(d),prev=i>0?getV(yrs[i-1]):null;
      const chg=prev&&prev>0?(v-prev)/prev*100:null;
      return`<td><div class="td-val">${fK(v)}</div>
        ${chg!=null?`<div class="td-chg" style="color:${chg>=0?'var(--o)':'var(--red)'}">
          ${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(1)}%</div>`:''}</td>`;
    }).join('');
    const cum=C.vis==='real'?yrs[yrs.length-1]?.cumLiqR:yrs[yrs.length-1]?.cumLiq;
    return`<tr>
      <td>
        <div class="td-name"><span style="width:6px;height:6px;border-radius:50%;background:${s.color};display:inline-block;flex-shrink:0"></span>${s.name}</div>
        <div class="td-type">${TYPES[s.type].label}</div>
      </td>
      ${cells}
      <td><div class="td-cum">${fK(cum)}</div><div class="td-cs">acumulado líquido</div></td>
    </tr>`;
  }).join('');

  return`
    <div class="ctrl">${metPills()}<div class="ctrl-sep"></div>${visPills()}</div>
    <div class="proj-wrap">
      <table>
        <thead><tr><th>Cenário / Modelo</th>${colH}<th style="color:var(--o)">Acum. ${C.hor}A — Líquido</th></tr></thead>
        <tbody>${rows||`<tr><td colspan="${C.hor+2}" style="text-align:center;padding:30px;color:var(--t3)">Nenhum cenário ativo</td></tr>`}</tbody>
      </table>
    </div>
    <div class="notes">
      <strong>Motor Tributário IRPF 2024 · SP</strong><br>
      <span class="hl">INSS progressivo</span>: 7,5% ≤ R$1.412 · 9% ≤ R$2.667 · 12% ≤ R$4.000 · 14% ≤ R$7.786 · Teto R$908,86/mês<br>
      <span class="hl">IR progressivo (mensal)</span>: isento ≤ R$2.259 · 7,5% ≤ R$2.827 · 15% ≤ R$3.751 · 22,5% ≤ R$4.665 · 27,5% acima<br>
      <span class="hl">PPR/PLR</span>: tabela exclusiva de fonte (isento ≤ R$6.677/ano) ·
      <span class="hl">Dividendos</span>: isentos de IR na PF — PJ, Sócios Non-Equity e Equity (lei vigente 2024) ·
      <span class="hl">RSU/Equity USD</span>: convertido pelo câmbio projetado ano a ano · IR como rendimento do trabalho no vesting ·
      <span class="hl">Ganho de Capital</span>: 15% ≤ R$5M (buy-out societário + carried interest) ·
      <span class="hl">CTC</span>: encargos patronais = INSS 20% + RAT 2% + Sist. S 5,8% + FGTS 8%
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render(){
  destroyAll();
  document.getElementById('eq-pills').innerHTML=
    [['Pessimista','pes','on-red'],['Base','base','on'],['Otimista','oti','on-grn']].map(([l,v,cls])=>
      `<button class="pill${C.eq===v?' '+cls:''}" onclick="C.eq='${v}';render()">${l}</button>`).join('');
  document.getElementById('tabs').innerHTML=
    [['dash','Dashboard'],['cenarios','Cenários'],['proj','Projeção 10 Anos']].map(([k,l])=>
      `<button class="tb${C.tab===k?' on':''}" onclick="C.tab='${k}';render()">${l}</button>`).join('');
  const projs=computeAll(),view=document.getElementById('view');
  if(C.tab==='dash')          view.innerHTML=viewDash(projs);
  else if(C.tab==='cenarios') view.innerHTML=viewCenarios();
  else                        view.innerHTML=viewProj(projs);
}

// ═══════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════
function boot(){
  // hide save btn for local users
  if(!_currentUser){
    document.getElementById('btn-save').style.display='none';
    document.getElementById('sync-dot').style.display='none';
  }
  if(!S.scenarios.find(s=>s.id===C.eid)) C.eid=S.scenarios[0]?.id||1;
  document.getElementById('app').classList.add('show');
  render();
}
</script>
